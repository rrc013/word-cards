<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Cards</title>
<meta name="theme-color" content="#3F7FE8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Cards">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
@font-face{font-family:"Andika";font-weight:400;font-style:normal;font-display:swap;src:url("./fonts/andika-400.woff2") format("woff2")}
@font-face{font-family:"Andika";font-weight:700;font-style:normal;font-display:swap;src:url("./fonts/andika-700.woff2") format("woff2")}
</style>
<style>
:root{
  --bg:#EAF2FF; --ink:#1E2A47; --soft:#5A6684; --card:#FFFFFF; --chip:#FFFFFF;
  --line:#C9D6F2; --coral:#F25F5C; --sun:#FFB400; --teal:#1FB5A3; --blue:#3F7FE8; --plum:#8C5AD8;
  --good:#1FA35C; --shadow:0 6px 0 rgba(30,42,71,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141B2E; --ink:#F2F5FF; --soft:#A9B4D0; --card:#212B45; --chip:#263152;
    --line:#34416A; --shadow:0 6px 0 rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141B2E; --ink:#F2F5FF; --soft:#A9B4D0; --card:#212B45; --chip:#263152;
  --line:#34416A; --shadow:0 6px 0 rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Andika","Comic Neue","Trebuchet MS",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.app{max-width:960px;margin:0 auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px;min-height:100%}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.modes{display:flex;background:var(--chip);border:3px solid var(--line);border-radius:999px;padding:4px}
.modes button{border:0;background:none;border-radius:999px;padding:8px 16px;font-size:1.05rem;font-weight:700;color:var(--soft)}
.modes button[aria-pressed="true"]{background:var(--blue);color:#fff}
.stars{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:6px}
.stars b{font-size:1.5rem}

.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt{border:3px solid var(--line);background:var(--chip);border-radius:14px;padding:6px 12px;font-size:.95rem;color:var(--soft)}
.opt[aria-pressed="true"]{border-color:var(--teal);color:var(--ink);background:color-mix(in srgb,var(--teal) 16%,var(--chip))}

/* the card */
.stage{perspective:1400px;display:flex;justify-content:center}
.card{
  position:relative;width:100%;max-width:560px;aspect-ratio:7/5;border:0;padding:0;background:none;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1);
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border-radius:28px;border:8px solid var(--accent,var(--coral));
  box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;
}
.back{transform:rotateY(180deg);gap:10px}
.tag{position:absolute;top:12px;left:16px;font-size:1.5rem;font-weight:700;color:var(--accent,var(--coral))}
.tap{position:absolute;bottom:10px;font-size:.95rem;color:var(--soft)}
.word{font-size:clamp(4rem,19vw,8.5rem);font-weight:700;line-height:1;letter-spacing:.02em;display:flex}
.word.long{font-size:clamp(2.4rem,10vw,5rem)}
.word span{display:inline-block;transition:transform .15s,color .15s}
.word span.lit{color:var(--accent,var(--coral));transform:translateY(-12px) scale(1.15)}
.word.say span{color:var(--accent,var(--coral))}
.emoji{font-size:clamp(3rem,13vw,5rem);line-height:1}
.sentence{font-size:clamp(1.6rem,6.5vw,2.6rem);text-align:center;line-height:1.3;max-width:20ch}
.sentence mark{background:none;color:var(--accent,var(--coral));font-weight:700;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.bounce{animation:bounce .45s}
@keyframes bounce{40%{transform:scale(1.06)}}

/* buttons */
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.big{
  border:0;border-radius:20px;padding:12px 18px;min-width:100px;font-size:1.15rem;font-weight:700;
  background:var(--chip);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.big .ic{font-size:1.8rem;line-height:1}
.big.yes{background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000)}
.big.again{background:var(--sun);border-color:var(--sun);color:#2B2100;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.arrow{min-width:64px;font-size:2rem;padding:10px}
.count{text-align:center;color:var(--soft);font-size:1.05rem}

/* find game */
.prompt{text-align:center;font-size:1.6rem;font-weight:700}
.hear{margin:0 auto;font-size:1.3rem;padding:16px 28px;background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.hear .ic{font-size:3rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.choice{
  border:6px solid var(--line);background:var(--card);border-radius:24px;box-shadow:var(--shadow);
  font-size:clamp(2.4rem,9vw,3.6rem);font-weight:700;padding:22px 8px;
}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}
.choice.wrong{animation:shake .4s;border-color:var(--coral)}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

.note{background:color-mix(in srgb,var(--sun) 22%,var(--card));border-radius:14px;padding:10px 14px;text-align:center}
.done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:30px 0}
.done h2{font-size:2.4rem;margin:0}
.done .emoji{font-size:5rem}
.foot{text-align:center;margin-top:auto}
.link{border:0;background:none;color:var(--soft);text-decoration:underline;font-size:.9rem}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}.bounce,.choice.wrong{animation:none}.confetti{display:none}
  .word span{transition:none}
}
/* progress piles */
.cardsWrap{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;grid-template-areas:"left main right";gap:16px;align-items:start}
.cardsMain{grid-area:main;min-width:0}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:20px}
.pile.left{grid-area:left}.pile.right{grid-area:right}
.pileTitle{font-weight:700;font-size:1.05rem;text-align:center}
.pileStack{position:relative;width:100%;height:170px}
.mini{position:absolute;left:50%;bottom:0;width:92px;height:62px;border-radius:10px;background:var(--card);
  border:4px solid var(--pc);box-shadow:0 2px 0 rgba(30,42,71,.18);transform:translate(-50%,var(--y)) rotate(var(--r));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;overflow:hidden;white-space:nowrap}
.mini.empty{border-style:dashed;border-color:var(--line);background:none;box-shadow:none}
.mini.new{animation:drop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translate(-50%,calc(var(--y) - 60px)) scale(1.2);opacity:0}}
.pileCount{font-size:2rem;font-weight:700;line-height:1}
.pile.left{--pc:var(--sun)}.pile.right{--pc:var(--good)}
.pile.left .pileCount{color:color-mix(in srgb,var(--sun) 70%,var(--ink))}.pile.right .pileCount{color:var(--good)}
.findWrap{max-width:760px;margin:0 auto;width:100%}
@media (max-width:680px){
  .cardsWrap{grid-template-columns:1fr 1fr;grid-template-areas:"left right" "main main";gap:8px}
  .pile{padding-top:0}.pileStack{height:120px}.mini{width:80px;height:54px}
}
@media (prefers-reduced-motion:reduce){.mini.new{animation:none}}
/* fireworks meter */
.findWrap{display:flex;gap:16px;align-items:stretch}
.findMain{flex:1;min-width:0}
.meter{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.meterGoal{font-size:2rem;line-height:1}
.meterTube{position:relative;flex:1;min-height:260px;width:44px;border:4px solid var(--line);border-radius:999px;background:var(--chip);overflow:hidden}
.meterFill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,var(--teal),var(--blue),var(--plum));transition:height .6s cubic-bezier(.3,1.4,.5,1)}
.meterTube::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 calc(10% - 2px),color-mix(in srgb,var(--line) 70%,transparent) calc(10% - 2px) 10%)}
.meterNum{font-weight:700;font-size:1.1rem}
.rockets{font-size:1.3rem;text-align:center;line-height:1.2;word-break:break-all;max-width:64px}
.fw{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;background:rgba(10,15,35,.82)}
.fwMsg{position:fixed;inset:0;z-index:31;pointer-events:none;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(2.4rem,9vw,4.2rem);font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:reduce){.meterFill{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="modes" role="group" aria-label="Game">
      <button id="mCards" aria-pressed="true">🃏 Cards</button>
      <button id="mFind" aria-pressed="false">👂 Find it</button>
    </div>
    <div class="stars" aria-live="polite"><b>⭐</b><span id="starCount">0</span>&nbsp;/&nbsp;<span id="total">0</span></div>
  </div>

  <div class="opts">
    <button class="opt" id="oShuffle" aria-pressed="false">🔀 Mix up</button>
    <button class="opt" id="oTricky" aria-pressed="false">🔁 Tricky words only</button>
  </div>

  <div id="noVoice" class="note" hidden>The voice isn’t playing. Check that text-to-speech is on in your phone’s Settings › System › Languages › Text-to-speech output, and that media volume is up.</div>

  <!-- Cards mode -->
  <section id="cardsView" class="cardsWrap">
    <div class="pile left" id="pileAgain" aria-live="polite"><div class="pileTitle">🔁 Practice</div><div class="pileStack"></div><div class="pileCount">0</div></div>
    <div class="pile right" id="pileKnow" aria-live="polite"><div class="pileTitle">⭐ I know it</div><div class="pileStack"></div><div class="pileCount">0</div></div>
    <div class="cardsMain">
    <div class="stage">
      <button class="card" id="card" aria-label="Word card. Tap to hear it.">
        <div class="face front">
          <div class="tag" id="tag">Aa</div>
          <div class="word" id="word"></div>
          <div class="tap">tap to hear it</div>
        </div>
        <div class="face back">
          <div class="emoji" id="emoji"></div>
          <div class="sentence" id="sentence"></div>
        </div>
      </button>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="big" id="bHear"><span class="ic">🔊</span>Hear it</button>
      <button class="big" id="bSpell"><span class="ic">🐢</span>Spell it</button>
      <button class="big" id="bFlip"><span class="ic">💬</span>Sentence</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="big arrow" id="bPrev" aria-label="Back">◀</button>
      <button class="big again" id="bAgain"><span class="ic">🔁</span>Practice again</button>
      <button class="big yes" id="bKnow"><span class="ic">⭐</span>I know it!</button>
      <button class="big arrow" id="bNext" aria-label="Next">▶</button>
    </div>
    <p class="count" id="count"></p>
    </div>
  </section>

  <!-- Find mode -->
  <section id="findView" class="findWrap" hidden>
    <div class="findMain">
      <p class="prompt">Listen, then tap the word!</p>
      <div class="row" style="margin-bottom:18px"><button class="big hear" id="bListen"><span class="ic">👂</span>Hear the word</button></div>
      <div class="choices" id="choices"></div>
      <p class="count" id="findScore"></p>
    </div>
    <div class="meter" role="img" id="meter" aria-label="0 of 10 to fireworks">
      <div class="meterGoal" aria-hidden="true">🎆</div>
      <div class="meterTube"><div class="meterFill" id="meterFill"></div></div>
      <div class="meterNum" id="meterNum">0/10</div>
      <div class="rockets" id="rockets" aria-hidden="true"></div>
    </div>
  </section>

  <!-- Finished -->
  <section id="doneView" class="done" hidden>
    <div class="emoji">🎉</div>
    <h2>You did every card!</h2>
    <p class="count" id="doneMsg"></p>
    <button class="big yes" id="bRestart"><span class="ic">🔄</span>Go again</button>
  </section>

  <div class="foot"><button class="link" id="bReset">Start my stars over</button></div>
</div>
<div class="confetti" id="confetti"></div>
<canvas class="fw" id="fw" hidden></canvas>
<div class="fwMsg" id="fwMsg" hidden>🎆 10 right! 🎆</div>

<script>
const WORDS = [
  ['a','I see a bug.','🐞'],['am','I am five!','🖐️'],['at','Look at me!','🙋‍♀️'],['and','You and me.','🤝'],['are','We are friends.','👭'],
  ['good','You are so good!','⭐'],
  ['my','This is my hat.','👒'],['me','Play with me!','🤸‍♀️'],['mother','I love my mother.','👩'],
  ['she','She can jump.','🦘'],['see','I see you!','👀'],['says','The cow says moo.','🐄'],['say','Say hello!','👋'],['said','He said yes.','🙂'],['saw','I saw a bird.','🐦'],['so','I am so happy!','🥳'],
  ['you','I love you.','💛'],['yes','Yes, I can!','👍'],
  ['baby','The baby is sleeping.','👶'],['big','The elephant is big!','🐘'],
  ['here','Come here, puppy!','🐶'],['his','That is his ball.','⚽'],
  ['Name','What is your name?','📛'],['new','I have new shoes.','👟'],['no','No, thank you.','✋'],
  ['to','We go to school.','🏫'],['too','I want to play too!','🙌'],['the','I see the sun.','☀️'],['this','This is my cat.','🐈'],
  ['can','I can swim.','🏊‍♀️'],['come','Come and play!','🛝'],
  ['do','I can do it!','💪'],
  ['I','I like cake.','🎂'],['is','It is fun!','🎈'],['it','I like it!','😋'],['in','The cat is in the box.','🐱'],["I'm","I'm happy!",'😄'],
  ['on','The hat is on my head.','🎩'],['of','A cup of milk.','🥛'],
  ['play','Let’s play!','🧸'],['pretty','What a pretty flower!','🌸'],['put','Put it here.','📦'],
  ['Kindergarten','I go to kindergarten.','🎒'],
  ['we','We like to dance.','💃'],['what','What is that?','❓'],
  ['father','My father is tall.','👨'],['for','This is for you.','🎁'],
  ['like','I like ice cream.','🍦'],['likes','She likes to sing.','🎤'],['love','I love my dog.','❤️'],['little','The mouse is little.','🐭']
].map(([w,s,e])=>({w,s,e,g:(w[0].toUpperCase()+w[0].toLowerCase())}));

const COLORS=['--coral','--blue','--teal','--plum','--sun'];
const LETTER={a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',n:'en',o:'oh',p:'pee',q:'cue',r:'are',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zee'};
const pretty=w=>w.replace(/'/g,'’');
const $=id=>document.getElementById(id);

/* ---------- saved progress ---------- */
let known=new Set(), tricky=new Set();
try{const d=JSON.parse(localStorage.getItem('sightwords-v1')||'{}');known=new Set(d.known||[]);tricky=new Set(d.tricky||[]);}catch(e){}
function save(){try{localStorage.setItem('sightwords-v1',JSON.stringify({known:[...known],tricky:[...tricky]}));}catch(e){}}

/* ---------- speech ---------- */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null; let voice=null; let runId=0;
const isAndroid=/Android/i.test(navigator.userAgent); let lastCancel=0, everStarted=false, fails=0; const keep=[];
if(!synth) $('noVoice').hidden=false;
function pickVoice(){
  if(!synth) return; const vs=synth.getVoices().filter(v=>/^en/i.test(v.lang));
  const pref=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Moira','Tessa'];
  voice=pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean)||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null;
}
if(synth){pickVoice();try{synth.addEventListener('voiceschanged',pickVoice);}catch(e){synth.onvoiceschanged=pickVoice;}}
function say(text,{rate=.8,pitch=1.1,onstart}={}){
  return new Promise(res=>{
    if(!synth) return res();
    let done=false; const finish=()=>{if(!done){done=true;res();}};
    const go=()=>{
      const u=new SpeechSynthesisUtterance(text);
      if(voice && !isAndroid) u.voice=voice;   /* Android: let the phone's own voice handle it */
      u.lang='en-US'; u.rate=rate; u.pitch=pitch; u.volume=1;
      u.onstart=()=>{everStarted=true;fails=0;$('noVoice').hidden=true;onstart&&onstart();};
      u.onend=finish; u.onerror=finish;
      keep.push(u); if(keep.length>20) keep.shift();   /* stops Chrome from dropping speech mid-way */
      try{synth.resume();}catch(e){}
      synth.speak(u);
      setTimeout(()=>{ if(!everStarted && !synth.speaking){ if(++fails>=2) $('noVoice').hidden=false; } },1800);
      setTimeout(finish,Math.max(4000,text.length*180));
    };
    const gap=Date.now()-lastCancel; gap<150 ? setTimeout(go,150-gap) : go();
  });
}
function hush(){runId++; if(synth){synth.cancel();lastCancel=Date.now();} document.querySelectorAll('.word span').forEach(s=>s.classList.remove('lit'));$('word').classList.remove('say');}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- little sounds ---------- */
let ac=null;
function tone(freqs,dur=.12,type='triangle',vol=.15){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
      const t=ac.currentTime+i*dur;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.8);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur*2);});
  }catch(e){}
}
const chime=()=>tone([523,659,784,1047]);
const boop=()=>tone([300,220],.15,'sine',.12);
function confetti(n=60){
  const box=$('confetti'),cols=['#F25F5C','#FFB400','#1FB5A3','#3F7FE8','#8C5AD8'];
  for(let i=0;i<n;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'vw';
    c.style.background=cols[i%5];c.style.animationDelay=Math.random()*.5+'s';c.style.animationDuration=1.2+Math.random()+'s';
    box.appendChild(c);setTimeout(()=>c.remove(),2600);}
}

/* ---------- deck ---------- */
let mode='cards', shuffle=false, onlyTricky=false, deck=[], pos=0;
function buildDeck(){
  let d=WORDS.map((_,i)=>i);
  if(onlyTricky){d=d.filter(i=>tricky.has(WORDS[i].w)); if(!d.length){onlyTricky=false;$('oTricky').setAttribute('aria-pressed','false');d=WORDS.map((_,i)=>i);}}
  if(shuffle) for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  deck=d;pos=0;
}
function stars(){$('starCount').textContent=known.size;$('total').textContent=WORDS.length;renderPiles();}
function accentFor(item){const letters=[...new Set(WORDS.map(x=>x.g))];return `var(${COLORS[letters.indexOf(item.g)%COLORS.length]})`;}

function showCard(){
  hush();
  const it=WORDS[deck[pos]], card=$('card');
  card.classList.remove('flipped');
  card.style.setProperty('--accent',accentFor(it));
  $('tag').textContent=it.g;
  const w=$('word');w.className='word'+(it.w.length>7?' long':'');w.innerHTML='';
  [...pretty(it.w)].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;w.appendChild(s);});
  $('emoji').textContent=it.e;
  const re=new RegExp(`\\b(${it.w.replace("'","['’]")})\\b`,'i');
  $('sentence').innerHTML=it.s.replace(/’/g,"'").replace(re,'<mark>$1</mark>').replace(/'/g,'’');
  $('count').textContent=`Card ${pos+1} of ${deck.length}`+(known.has(it.w)?'  ⭐':'');
  $('bKnow').querySelector('.ic').textContent=known.has(it.w)?'🌟':'⭐';
}
function bounce(el){el.classList.remove('bounce');void el.offsetWidth;el.classList.add('bounce');}

async function hearWord(){
  hush();const id=runId,it=WORDS[deck[pos]];const w=$('word');bounce(w);w.classList.add('say');
  await say(it.w==='a'?'a':it.w,{rate:.75}); if(id===runId) w.classList.remove('say');
}
async function spellWord(){
  hush();const id=runId,it=WORDS[deck[pos]];const spans=[...$('word').children];
  if($('card').classList.contains('flipped')) $('card').classList.remove('flipped');
  for(let i=0;i<it.w.length;i++){
    const ch=it.w[i].toLowerCase(); if(!LETTER[ch]) continue;
    await say(LETTER[ch],{rate:.85,onstart:()=>{if(id!==runId)return;spans.forEach(s=>s.classList.remove('lit'));spans[i].classList.add('lit');}});
    if(id!==runId) return; await wait(180);
  }
  spans.forEach(s=>s.classList.remove('lit')); if(id!==runId) return;
  await wait(200); $('word').classList.add('say'); bounce($('word'));
  await say(it.w,{rate:.75}); if(id===runId) $('word').classList.remove('say');
}
async function flip(){
  const card=$('card'),it=WORDS[deck[pos]];hush();
  card.classList.toggle('flipped');
  if(card.classList.contains('flipped')){await wait(350);say(it.s,{rate:.8});}
}
function next(){ if(pos<deck.length-1){pos++;showCard();} else finish(); }
function prev(){ if(pos>0){pos--;showCard();} }
function finish(){
  hush();$('cardsView').hidden=true;$('doneView').hidden=false;
  $('doneMsg').textContent=`You have ${known.size} stars!`;chime();confetti(90);say('Hooray! You did every card!',{rate:.9,pitch:1.25});
}

$('card').onclick=()=>{ $('card').classList.contains('flipped') ? (hush(),say(WORDS[deck[pos]].s,{rate:.8})) : hearWord(); };
$('bHear').onclick=()=>{ $('card').classList.remove('flipped'); hearWord(); };
$('bSpell').onclick=spellWord;
$('bFlip').onclick=flip;
$('bNext').onclick=next; $('bPrev').onclick=prev;
$('bKnow').onclick=async()=>{
  const it=WORDS[deck[pos]];const was=known.has(it.w);known.add(it.w);tricky.delete(it.w);save();sesKnow.add(it.w);sesAgain.delete(it.w);stars();
  hush();chime();if(!was)confetti(30);await say(['Great job!','Super!','You got it!','Yay!'][Math.floor(Math.random()*4)],{rate:.95,pitch:1.25});
  next();
};
$('bAgain').onclick=async()=>{
  const it=WORDS[deck[pos]];tricky.add(it.w);known.delete(it.w);save();sesAgain.add(it.w);sesKnow.delete(it.w);stars();hush();
  await say('Let’s practice it again later.',{rate:.95,pitch:1.15}); next();
};
$('bRestart').onclick=()=>{sesKnow.clear();sesAgain.clear();renderPiles();buildDeck();$('doneView').hidden=true;$('cardsView').hidden=false;showCard();};

/* ---------- Find it game ---------- */
let target=null, findRight=0, findTries=0, locked=false, lastSpot=-1;
function mix(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newRound(){
  locked=false;
  const pool=deck.length>=3?deck:WORDS.map((_,i)=>i);
  target=WORDS[pool[Math.floor(Math.random()*pool.length)]];
  const others=mix(WORDS.filter(x=>x.w.toLowerCase()!==target.w.toLowerCase())).slice(0,2);
  let spot; do{spot=Math.floor(Math.random()*3);}while(spot===lastSpot && Math.random()<.7);
  lastSpot=spot;
  const opts=others.slice(); opts.splice(spot,0,target);
  const box=$('choices');box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=pretty(o.w);
    b.style.color=`var(--ink)`;b.onclick=()=>pick(o,b);box.appendChild(b);});
  $('findScore').textContent=findTries?`⭐ ${findRight} found`:'';
  sayTarget();
}
function sayTarget(){hush();say('Find the word… '+target.w,{rate:.8});}
async function pick(o,btn){
  if(locked) return;
  if(o===target){
    locked=true;findRight++;findTries++;btn.classList.add('right');chime();
    known.add(target.w);save();stars();hush();
    if(findRight%10===0){
      $('meterFill').style.height='100%';$('meterNum').textContent='10/10';
      await say(`Yes! ${target.w}!`,{rate:.9,pitch:1.25});
      await fireworks();
    }else{
      confetti(30);updateMeter();
      await say(`Yes! ${target.w}!`,{rate:.9,pitch:1.25});
    }
    updateMeter();await wait(400);newRound();
  }else{
    findTries++;btn.classList.remove('wrong');void btn.offsetWidth;btn.classList.add('wrong');boop();
    tricky.add(target.w);save();hush();await say(`That says ${o.w}. Try again! Find… ${target.w}`,{rate:.85});
  }
}
$('bListen').onclick=sayTarget;

/* ---------- progress meter + fireworks ---------- */
function updateMeter(){
  const n=findRight%10, sets=Math.floor(findRight/10);
  $('meterFill').style.height=(n*10)+'%';
  $('meterNum').textContent=`${n}/10`;
  $('rockets').textContent='🎆'.repeat(sets);
  $('meter').setAttribute('aria-label',`${n} of 10 to fireworks`);
}
function audio(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();return ac;}
function whistle(){try{const a=audio(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type='sine';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(1500,t+.6);
  g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.65);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.7);}catch(e){}}
function pop(){try{const a=audio(),t=a.currentTime,len=Math.floor(a.sampleRate*.5),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=.25;s.connect(g).connect(a.destination);s.start(t);}catch(e){}}
function fireworks(){
  return new Promise(res=>{
    const msg=$('fwMsg');
    say('Wow! Ten right! Fireworks!',{rate:.95,pitch:1.25});
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){msg.hidden=false;setTimeout(()=>{msg.hidden=true;res();},2500);return;}
    const cv=$('fw'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cv.hidden=false;msg.hidden=false;
    const cols=['#F25F5C','#FFB400','#1FB5A3','#3F7FE8','#C08BFF'];
    const rockets=[],sparks=[],t0=performance.now();
    for(let i=0;i<7;i++) rockets.push({x:W*(.12+.76*Math.random()),y:H,vy:-(H*.012+Math.random()*H*.005),ty:H*(.12+.3*Math.random()),at:i*340,c:cols[i%5],live:false,done:false});
    function burst(r){pop();for(let k=0;k<70;k++){const a=Math.PI*2*k/70,s=1.5+Math.random()*4;
      sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:Math.random()<.2?'#FFFFFF':r.c});}}
    function frame(now){
      const el=now-t0;ctx.clearRect(0,0,W,H);
      rockets.forEach(r=>{if(r.done||el<r.at)return;if(!r.live){r.live=true;whistle();}
        r.y+=r.vy;ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(r.x,r.y,4,0,7);ctx.fill();
        if(r.y<=r.ty){r.done=true;burst(r);}});
      sparks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.98;p.life-=.012;
        if(p.life>0){ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();}});
      ctx.globalAlpha=1;
      if(el<4300) requestAnimationFrame(frame);
      else {ctx.clearRect(0,0,W,H);cv.hidden=true;msg.hidden=true;res();}
    }
    requestAnimationFrame(frame);
  });
}

/* ---------- mode + options ---------- */
function setMode(m){
  mode=m;hush();$('mCards').setAttribute('aria-pressed',m==='cards');$('mFind').setAttribute('aria-pressed',m==='find');
  $('doneView').hidden=true;$('cardsView').hidden=m!=='cards';$('findView').hidden=m!=='find';
  buildDeck(); if(m==='cards') showCard(); else {updateMeter();newRound();}
}
$('mCards').onclick=()=>setMode('cards'); $('mFind').onclick=()=>setMode('find');
$('oShuffle').onclick=()=>{shuffle=!shuffle;$('oShuffle').setAttribute('aria-pressed',shuffle);setMode(mode);};
$('oTricky').onclick=()=>{
  if(!onlyTricky&&!tricky.size){hush();say('No tricky words yet!',{rate:.95,pitch:1.2});return;}
  onlyTricky=!onlyTricky;$('oTricky').setAttribute('aria-pressed',onlyTricky);setMode(mode);
};
$('bReset').onclick=()=>{if(confirm('Clear all stars and tricky words?')){known.clear();tricky.clear();save();sesKnow.clear();sesAgain.clear();stars();onlyTricky=false;$('oTricky').setAttribute('aria-pressed','false');setMode(mode);}};

/* ---------- progress piles ---------- */
let lastCounts={k:-1,a:-1};
let sesKnow=new Set(), sesAgain=new Set();
function drawPile(el,words,prev){
  const st=el.querySelector('.pileStack');st.innerHTML='';
  el.querySelector('.pileCount').textContent=words.length;
  if(!words.length){const e=document.createElement('div');e.className='mini empty';e.style.setProperty('--y','0px');e.style.setProperty('--r','0deg');st.appendChild(e);return;}
  const n=Math.min(words.length,25);
  for(let i=0;i<n;i++){
    const m=document.createElement('div');m.className='mini';
    m.style.setProperty('--y',(-i*4)+'px');m.style.setProperty('--r',((i%2?1:-1)*(i%3)*1.6)+'deg');
    if(i===n-1){m.textContent=pretty(words[words.length-1]);if(prev>=0&&words.length>prev)m.classList.add('new');}
    st.appendChild(m);
  }
}
function renderPiles(){
  const k=[...sesKnow], a=[...sesAgain];
  drawPile($('pileKnow'),k,lastCounts.k);drawPile($('pileAgain'),a,lastCounts.a);
  lastCounts={k:k.length,a:a.length};
}

stars(); buildDeck(); showCard();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
